apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-worker
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: connectionString
      value: amqp://guest:guest@rabbitmq:5672
    - name: consumerID
      value: worker-consumer
    - name: exchangeKind
      value: topic
    - name: durable
      value: "true"
    - name: deletedWhenUnused
      value: "false"
    - name: autoAck
      value: "false"
    - name: maxConcurrentHandlers
      value: "1"
    - name: prefetchCount
      value: "1"
